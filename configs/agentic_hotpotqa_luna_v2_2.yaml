agent:
  workflow_mode: single_agent_v2_2
  max_steps: 10
  max_policy_attempts: 12
  max_consecutive_invalid_attempts: 2
  max_retrieved_tokens: 12000
  context_mode: compact_evidence
  enabled_expansions:
    - ENTITY_MENTIONED_IN_SENTENCE
    - SENTENCE_MENTIONS_ENTITY
    - ENTITY_CO_OCCURS_ENTITY_SENTENCE
    - CHUNK_ADJACENT_CHUNK

policy:
  provider: openai
  model: gpt-5.6-luna
  max_retries: 2

# V2-2 FINISH normally supplies the answer directly. This remains a
# same-provider fallback for scripted decisions without an answer.
answer:
  provider: openai
  model: gpt-5.6-luna
  max_retries: 2
