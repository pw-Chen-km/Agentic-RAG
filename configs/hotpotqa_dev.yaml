substrate:
  corpus_id: hotpotqa_dev
  dataset: hotpotqa
  split: dev
  sentence_segmenter: spacy
  sentence_model: en_core_web_sm
  max_chunk_tokens: 256
  overlapping_chunks: false

entity:
  extractor: spacy
  exact_name_type_merge: true
  abbreviation_detector: scispacy
  external_kb_linking:
    enabled: false

retrieval:
  top_k: 5
  bm25:
    sentence: true
    chunk: true
  dense:
    model: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 64
    device:
    entity: true
    sentence: true
    chunk: true
