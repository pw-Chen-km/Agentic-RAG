agent:
  workflow_mode: single_agent_v3
  max_steps: 10
  max_policy_attempts: 12
  max_consecutive_invalid_attempts: 2
  max_retrieved_tokens: 12000
  context_mode: compact_evidence
  enabled_expansions:
    - ENTITY_MENTIONED_IN_SENTENCE
    - SENTENCE_MENTIONS_ENTITY
    - ENTITY_CO_OCCURS_ENTITY_SENTENCE
    - CHUNK_ADJACENT_CHUNK

policy:
  provider: openai
  model: gpt-5.6-luna
  max_retries: 2

# V3 answers directly in FINISH. This remains a same-provider fallback for
# compatibility with shared harness construction.
answer:
  provider: openai
  model: gpt-5.6-luna
  max_retries: 2
