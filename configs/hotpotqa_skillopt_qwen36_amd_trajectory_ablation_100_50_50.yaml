run_name: hotpotqa_skillopt_qwen36_amd_trajectory_ablation_100_50_50

model:
  backend: qwen_chat
  optimizer: qwen3.6:35b-a3b-bf16
  target: qwen3.6:35b-a3b-bf16
  optimizer_backend: qwen_chat
  target_backend: qwen_chat
  qwen_chat_base_url: http://127.0.0.1:11435/v1
  qwen_chat_api_key: ollama-local
  qwen_chat_temperature: 0
  qwen_chat_timeout_seconds: 600
  qwen_chat_max_tokens: 16384
  qwen_chat_enable_thinking: true
  optimizer_qwen_chat_base_url: http://127.0.0.1:11435/v1
  optimizer_qwen_chat_api_key: ollama-local
  optimizer_qwen_chat_temperature: 0
  optimizer_qwen_chat_timeout_seconds: 600
  optimizer_qwen_chat_max_tokens: 16384
  optimizer_qwen_chat_enable_thinking: true
  target_qwen_chat_base_url: http://127.0.0.1:11435/v1
  target_qwen_chat_api_key: ollama-local
  target_qwen_chat_temperature: 0
  target_qwen_chat_timeout_seconds: 600
  target_qwen_chat_max_tokens: 8192
  target_qwen_chat_enable_thinking: false

train:
  num_epochs: 1
  train_size: 100
  batch_size: 20
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 5
  merge_batch_size: 3
  analyst_workers: 1
  max_analyst_rounds: 1
  failure_only: false

optimizer:
  learning_rate: 1
  min_learning_rate: 1
  lr_scheduler: constant
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 50
  test_env_num: 50
  eval_test: true

env:
  name: agentic_rag_hotpotqa
  workers: 1
  workflow_label: trajectory_representation_ablation
  judge_model: qwen3.6:35b-a3b-bf16
