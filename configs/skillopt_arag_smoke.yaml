run_name: arag_skillopt_workflow_smoke

model:
  backend: openai_chat
  optimizer: gpt-5.6-luna
  target: gpt-5.6-luna
  optimizer_backend: openai_chat
  target_backend: openai_chat
  azure_openai_endpoint: https://api.openai.com/v1
  azure_openai_auth_mode: openai_compatible

train:
  num_epochs: 1
  train_size: 6
  batch_size: 3
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 3
  merge_batch_size: 3
  analyst_workers: 1
  max_analyst_rounds: 1
  failure_only: false

optimizer:
  learning_rate: 1
  min_learning_rate: 1
  lr_scheduler: constant
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 6
  test_env_num: 6
  eval_test: true

env:
  name: agentic_rag_arag
  workers: 1
  workflow_label: workflow_smoke
  judge_model: gpt-5.6-luna
