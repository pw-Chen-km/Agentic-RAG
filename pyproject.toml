[project]
name = "arag-skillopt"
version = "0.1.0"
description = "Official A-RAG runtime with a standalone formatted SkillOpt adapter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28.0",
  "tiktoken>=0.5.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "numpy>=1.24.0",
  "regex>=2023.0.0",
]

[project.optional-dependencies]
full = ["sentence-transformers>=2.7.0", "transformers>=4.51.0", "pandas>=2.0.0", "pyarrow>=12.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/arag", "src/arag_skillopt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
