[project]
name = "agentic-rag"
version = "0.2.0"
description = "Single-agent semantic-memory retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bm25s>=0.3,<0.4",
    "numpy>=1.26,<2",
    "ollama>=0.6.2,<0.7",
    "openai>=2,<3",
    "pyarrow>=19,<23",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "scipy>=1.14,<2",
    "spacy>=3.8,<3.9",
    "scispacy>=0.6.2,<0.7",
    "sentence-transformers>=5,<6",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]
skillopt = [
    "skillopt==0.2.0",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "real_models: downloads and exercises real spaCy/scispaCy/MiniLM models",
    "openai_smoke: opt-in live gpt-5.6-luna Policy smoke test",
    "ollama_smoke: opt-in live local Ollama Policy smoke test",
    "skillopt_smoke: opt-in live 18-question SkillOpt workflow smoke test",
]

[tool.coverage.run]
source = ["agentic_rag"]
branch = true
